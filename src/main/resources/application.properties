spring.application.name=tourist-guide
server.port=8080

# Secrets are NOT stored here. They come from environment variables
# (Render dashboard in production, or a git-ignored .env file locally - see .env.example).
spring.config.import=optional:file:./.env[.properties]

spring.data.mongodb.uri=${MONGODB_URI}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OpenWeatherMap key, used server-side by /api/weather (never sent to the browser).
# Optional: without it /api/weather answers 503 and the site shows a plain fallback.
weather.api-key=${WEATHER_API_KEY:}

# Optional: password for admin@junnar.com (created/updated on startup when set)
app.admin.password=${ADMIN_PASSWORD:}
