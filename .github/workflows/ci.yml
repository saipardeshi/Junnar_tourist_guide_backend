name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # TouristGuideApplicationTests boots the whole app, and the seed runner talks to MongoDB.
    # (The other tests mock their repositories.) This is a throw-away database, never production.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"   # matches the Dockerfile / pom.xml
          cache: maven

      - name: Build and test
        run: mvn -B verify
